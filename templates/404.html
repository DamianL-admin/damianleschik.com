{% extends "base.html" %}
{% block main %}
<div class="page-head">
  <div class="wrap narrow">
    <h1>{{ t.not_found_title }}</h1>
    <p class="lead">{{ t.not_found_text }}</p>
    <p><a class="button" href="{{ rel(routes.home) }}">{{ t.not_found_link }}</a></p>
    <p lang="de">Seite nicht gefunden. <a href="{{ rel('/de/') }}">Zur deutschen Startseite</a>.</p>
  </div>
</div>
<script>
/* Alte Adressen auf die neuen umleiten (Deutsch jetzt unter /de/, Englisch unter /). */
(function () {
  var map = {{ old_paths | tojson }}, p = location.pathname, target = null;
  Object.keys(map).forEach(function (k) {
    if (!target && p.indexOf(k) === 0) target = map[k] + p.slice(k.length);
  });
  if (target && target !== p) location.replace(target + location.search + location.hash);
})();
</script>
{% endblock %}
