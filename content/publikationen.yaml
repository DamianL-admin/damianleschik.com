- id: leschik-2025-jobm
  type: article
  year: 2025
  authors: ["Leschik, Damian"]
  title: "Model evaluation of post-M&A success metrics in the German biopharmaceutical industry"
  journal: Journal of Business Models
  volume: 13
  issue: 1
  pages: "146–167"
  doi: 10.54337/jobm.v13i1.7502
  language: en
  open_access: true
  topics: [m-and-a]
  summary:
    de: Auf Basis einer Befragung von 384 kleinen und mittleren Biopharma-Unternehmen in Deutschland prüft die Studie mit PLS-SEM, welche Erfolgskennzahlen den Umsatz nach einer Fusion oder Übernahme erklären. Einen signifikanten Einfluss haben vor allem der effiziente Einsatz von Personal und Ressourcen sowie die klinische Erfolgsrate.
    en: Using survey data from 384 small and medium-sized biopharmaceutical companies in Germany and PLS-SEM, the study tests which success metrics explain post-M&A revenue. Efficient allocation of personnel and resources and the clinical success rate have significant effects.
  verified: true
  source: Journal of Business Models (journals.aau.dk)

