- id: leschik-2022-jbs
  type: article
  year: 2022
  authors: ["Leschik, Damian", "Rossberger, Robert", "Oczkowski, Edward"]
  title: "M&As in Germany: Measuring success for the pharma and biotech industries"
  journal: Journal of Business Strategy
  volume: 43
  issue: 2
  pages: "87–95"
  doi: 10.1108/JBS-07-2020-0153
  note: {de: "Online vorab erschienen am 9. Dezember 2020.", en: "Published online on 9 December 2020."}
  language: en
  topics: [m-and-a]
  summary:
    de: Auf Basis von Tiefeninterviews mit Führungskräften, die an Fusionen und Übernahmen beteiligt waren, identifiziert die Studie Erfolgskennzahlen für kleine und mittlere Pharma- und Biotech-Unternehmen in Deutschland, etwa integrierte Unternehmenskulturen, Mitarbeiterbindung, neues Technologiewissen, mehr patentgeschützte Produkte und höhere klinische Erfolgsraten. Die Befragten kombinieren mehrere Kennzahlen mit finanziellen Instrumenten.
    en: Based on in-depth interviews with executives involved in mergers and acquisitions, the study identifies success metrics for small and medium-sized pharmaceutical and biotech companies in Germany, such as integrated cultures, employee retention, new technology knowledge, more patent-protected products and higher clinical success rates. Interviewees combine several metrics with monetary tools.
  verified: true
  source: Emerald Insight

