- id: leschik-lac-2023-tesla
  type: proceedings
  year: 2023
  authors: ["Leschik, Damian", "Lac, Visieu"]
  title: "Application of sentiment analysis and topic modelling in marketing and management: Tesla supercharger example"
  container: "Tagungsband zur IU-Fachtagung Content Marketing 2.0: Potenziale und Herausforderungen neuer Ansätze des Content Marketings"
  editors: ["Altendorfer, Laura-Maria", "Arweck, Josef", "Egger, Carolin", "Fox, Caterina", "Huber, Brigitte", "Langner, Anne-Kristin", "O'Gorman, Susanne", "Wecke, Bernhard"]
  publisher: IU Internationale Hochschule
  pages: "27–40"
  url: https://res.cloudinary.com/iugroup/image/upload/v1704706555/Tagungsband_Content_Marketing_2.0_ylyhre.pdf
  language: en
  topics: [consumer-insights]
  summary:
    de: Die Studie kombiniert Sentimentanalyse und Topic Modelling (LDA), um rund 4.700 deutschsprachige Online-Kommentare zur Öffnung des Tesla-Supercharger-Netzes für andere Marken auszuwerten. Ein auf deutschen Texten trainiertes BERT-Modell schnitt am besten ab; die Stimmung war überwiegend negativ, häufige Themen waren Preise, Verfügbarkeit und blockierte Ladeplätze.
    en: The study combines sentiment analysis and topic modelling (LDA) to analyse about 4,700 German-language online comments on Tesla opening its Supercharger network to other brands. A BERT model trained on German text performed best; sentiment was mostly negative, with pricing, availability and blocked charging bays as frequent topics.
  verified: true
  source: Tagungsband (PDF der IU); Schreibweise O'Gorman laut Inhaltsverzeichnis, Autorenzeile und Kurzbiografie (Titelblatt mit Tippfehler „O'Gormann“)

